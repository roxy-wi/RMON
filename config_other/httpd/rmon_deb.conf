<VirtualHost *:443>
    AddDefaultCharset UTF-8
    SetEnv PYTHONIOENCODING utf8

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/rmon.crt
    SSLCertificateKeyFile /etc/ssl/certs/rmon.key

#    ServerName rmon.example.com
    ErrorLog /var/log/apache2/rmon.error.log
    CustomLog /var/log/apache2/rmon.access.log combined
    TimeOut 600
    LimitRequestLine 16380

    DocumentRoot /var/www/rmon

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /_rmon/ !
    <Location /_rmon/>
        Require all denied
    </Location>
    ProxyPass / unix:/run/rmon/rmon.sock|http://localhost/ timeout=600
    ProxyPassReverse / http://localhost/

    <IfModule mod_headers.c>
        Header set X-XSS-Protection: 1;
        Header set X-Frame-Options: deny
        Header set X-Content-Type-Options: nosniff
        Header set Strict-Transport-Security: max-age=3600;
        Header set Cache-Control no-cache
        Header set Expires: 0

        <filesMatch ".(ico|css|js|gif|jpeg|jpg|png|svg|woff|ttf|eot)$">
                Header set Cache-Control "max-age=86400, public"
        </filesMatch>
	</IfModule>
</VirtualHost>
