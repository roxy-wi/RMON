[main]
log_path = /var/log/rmon
lib_path = /var/lib/rmon
# Prefer the RMON_SECRET_PHRASE environment variable in production.
secret_phrase = CHANGE_ME

[mysql]
# By default Sqlite DB is used
enable = 0
mysql_user = rmon
mysql_password = rmon
mysql_db = rmon
mysql_host = 127.0.0.1
mysql_port = 3306

[pgsql]
# By default Sqlite DB is used
enable = 0
user = rmon
password = rmon
db = rmon
host = 127.0.0.1
port = 5432

[server_deployment]
# Default image for servers installed through the RMON interface.
image = ghcr.io/roxy-wi/rmon/rmon-server:7.0
# Classic result connections: http, https or mtls.
# HTTPS client collection requires a reverse proxy or load balancer.
transport = http
# Optional certificate and GeoIP files must already exist on each target host.
# tls_cert_file = /etc/rmon/certificates/server.crt
# tls_key_file = /etc/rmon/certificates/server.key
# tls_ca_file = /etc/rmon/certificates/ca.crt
# probe_ca_file = /etc/rmon/certificates/ca.crt
# probe_client_cert_file = /etc/rmon/certificates/probe.crt
# probe_client_key_file = /etc/rmon/certificates/probe.key
# client_trusted_proxies = 10.0.0.0/24
# client_geoip_database = /var/lib/rmon/GeoLite2-Country.mmdb
