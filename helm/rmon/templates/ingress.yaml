{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rmon.fullname" . }}
  labels:
    {{- include "rmon.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if and .Values.server.enabled (has "client" .Values.server.roles) }}
          - path: /api/v1/client/events
            pathType: Exact
            backend:
              service:
                name: {{ include "rmon.fullname" . }}-client
                port:
                  number: 5102
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rmon.fullname" . }}-web
                port:
                  number: {{ .Values.service.port }}
{{- end }}
